<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>智影链 - 身份认证</title>

    <!-- 外部依赖：动画/图标 + jQuery/Alerter/Three/Vanta 背景特效（CDN） -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <style>
      /* 全屏登录页：锁定滚动，背景交给 Vanta 渲染 */
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: "Segoe UI", sans-serif;
      }

      /* Vanta 背景容器：铺满页面并置于内容下方 */
      #bg-canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      /* 登录卡片居中布局 */
      .login-container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .login-card {
        width: 380px;
        padding: 40px;
        background: rgba(16, 20, 30, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        box-shadow: 0 0 50px rgba(0, 242, 234, 0.15);
        text-align: center;
      }
      .title {
        font-size: 28px;
        font-weight: 900;
        margin-bottom: 10px;
        letter-spacing: 2px;
      }
      .subtitle {
        font-size: 14px;
        color: #aaa;
        margin-bottom: 30px;
      }

      /* 输入框统一样式：error class 用于提示校验失败 */
      input {
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid #333;
        color: #fff;
        border-radius: 8px;
        box-sizing: border-box;
        outline: none;
        transition: 0.3s;
      }
      input:focus {
        border-color: #00f2ea;
        box-shadow: 0 0 10px rgba(0, 242, 234, 0.2);
      }

      /* 错误提示：仅改变视觉，不影响输入值与提交流程 */
      input.error {
        border-color: #ff0050;
        box-shadow: 0 0 10px rgba(255, 0, 80, 0.2);
      }

      /* 主按钮：登录/注册共用，注册按钮在行内覆盖颜色 */
      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: #00f2ea;
        color: #000;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
        margin-top: 10px;
      }
      .btn:hover {
        box-shadow: 0 0 20px rgba(0, 242, 234, 0.5);
        transform: scale(1.02);
      }

      /* 模式切换入口：登录 <-> 注册 */
      .switch {
        margin-top: 20px;
        font-size: 12px;
        color: #888;
        cursor: pointer;
      }
      .switch:hover {
        color: #fff;
        text-decoration: underline;
      }
      .hidden {
        display: none;
      }

      /* 规则提示：注册模式下显示；登录模式隐藏 */
      .rule-text {
        font-size: 12px;
        color: #666;
        text-align: left;
        margin-bottom: 5px;
        margin-top: -10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- 背景挂载点：VANTA.NET 将注入 canvas 动态背景 -->
    <div id="bg-canvas"></div>

    <div class="login-container">
      <div class="login-card animate__animated animate__fadeInDown">
        <div class="title"><i class="fas fa-cube"></i> 智影链</div>
        <div class="subtitle">Smart Shadow Chain V2.0</div>

        <!-- 登录表单：成功后写入 localStorage 并跳转到 /dashboard -->
        <div id="login-form">
          <input type="text" id="l_user" placeholder="请输入用户名" />
          <input type="password" id="l_pass" placeholder="请输入密码" />
          <button class="btn" onclick="doLogin()">进入系统</button>
          <div class="switch" onclick="switchMode('signup')">
            没有账号？立即注册
          </div>
        </div>

        <!-- 注册表单：校验用户名/密码必须包含特殊字符 -->
        <div id="signup-form" class="hidden">
          <input
            type="text"
            id="s_user"
            placeholder="设置用户名 (需含特殊符号)"
          />
          <div class="rule-text" id="rule_user">* 必须包含符号 (如 _ @ #)</div>

          <input
            type="password"
            id="s_pass"
            placeholder="设置密码 (需含特殊符号)"
          />
          <div class="rule-text" id="rule_pass">
            * 必须包含符号 (如 ! $ % ^)
          </div>

          <button
            class="btn"
            style="background: #ff0050; color: #fff"
            onclick="doSignup()"
          >
            确认注册
          </button>
          <div class="switch" onclick="switchMode('login')">返回登录</div>
        </div>
      </div>
    </div>

    <script>
      // 背景特效初始化：颜色与页面主色一致
      VANTA.NET({
        el: "#bg-canvas",
        mouseControls: true,
        touchControls: true,
        minHeight: 200.0,
        minWidth: 200.0,
        scale: 1.0,
        scaleMobile: 1.0,
        color: 0x00f2ea,
        backgroundColor: 0x000000,
      });

      // 模式切换：清空输入、移除 error 样式，并控制规则提示显示
      function switchMode(mode) {
        $(".rule-text").hide();
        $("input").removeClass("error").val("");

        if (mode === "signup") {
          $("#login-form").hide();
          $("#signup-form").fadeIn();
          $(".rule-text").fadeIn();
        } else {
          $("#signup-form").hide();
          $("#login-form").fadeIn();
        }
      }

      // 登录：POST /api/login，成功后写入 smart_user 并跳转 dashboard
      function doLogin() {
        var u = $("#l_user").val(),
          p = $("#l_pass").val();
        if (!u || !p) return Swal.fire("提示", "请输入完整", "warning");

        $.post("/api/login", { username: u, password: p }, function (res) {
          localStorage.setItem("smart_user", res.user);
          Swal.fire({
            icon: "success",
            title: "验证通过",
            text: "正在连接区块链节点...",
            timer: 1500,
            showConfirmButton: false,
          }).then(() => {
            window.location.href = "/dashboard";
          });
        }).fail(function (err) {
          Swal.fire("错误", err.responseJSON.error, "error");
        });
      }

      // 注册：前端先做格式校验，再 POST /api/signup
      function doSignup() {
        var u = $("#s_user").val();
        var p = $("#s_pass").val();

        // 特殊字符校验：要求至少包含一个常见符号
        var symbolRegex = /[!@#$%^&*(),.?":{}|<>_+\-=\[\]\\]/;

        if (!u || !symbolRegex.test(u)) {
          $("#s_user").addClass("error").focus();
          return Swal.fire({
            icon: "warning",
            title: "格式错误",
            text: "为了安全，用户名必须包含至少一个特殊符号 (例如: User_01, Alice@BUPT)",
            confirmButtonColor: "#ff0050",
          });
        } else {
          $("#s_user").removeClass("error");
        }

        if (!p || !symbolRegex.test(p)) {
          $("#s_pass").addClass("error").focus();
          return Swal.fire({
            icon: "warning",
            title: "密码太简单",
            text: "密码必须包含至少一个特殊符号 (例如: 123!@#)",
            confirmButtonColor: "#ff0050",
          });
        } else {
          $("#s_pass").removeClass("error");
        }

        // 校验通过后提交：后端负责创建账号与返回结果
        $.post("/api/signup", { username: u, password: p }, function (res) {
          Swal.fire("注册成功", "请登录", "success");
          switchMode("login");
        }).fail(function (err) {
          Swal.fire("错误", err.responseJSON.error, "error");
        });
      }
    </script>
  </body>
</html>
