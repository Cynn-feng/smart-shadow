<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>智影链工作台</title>

    <!-- UI 基础依赖：图标 / 动画 / 弹窗 / 背景特效（均为 CDN 加载） -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <style>
      /* 主题色与玻璃拟态底色：集中管理，便于统一换肤 */
      :root {
        --primary: #00f2ea;
        --secondary: #ff0050;
        --glass: rgba(16, 20, 30, 0.9);
      }

      /* 页面整体：全屏布局 + 关闭滚动条（内容区自行滚动） */
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0b0e14;
        color: #fff;
        overflow: hidden;
        display: flex;
        height: 100vh;
      }

      /* SweetAlert2 在部分浏览器会影响高度计算，这里强制保持全屏 */
      html.swal2-height-auto,
      body.swal2-height-auto {
        height: 100vh !important;
      }

      /* 左侧栏/主内容强制全高，避免弹窗开关后出现布局跳动 */
      .sidebar {
        height: 100vh;
        box-sizing: border-box;
      }

      .main-content {
        height: 100vh;
        box-sizing: border-box;
      }

      /* Vanta 背景层：固定铺满并置于最底层 */
      #bg-canvas {
        position: fixed;
        z-index: -1;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* Sidebar：导航 + 用户信息区 */
      .sidebar {
        width: 260px;
        background: rgba(0, 0, 0, 0.8);
        border-right: 1px solid #333;
        display: flex;
        flex-direction: column;
        padding: 20px;
        backdrop-filter: blur(10px);
      }
      .logo {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 40px;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo i {
        color: var(--primary);
      }

      /* Menu：active 通过 class 控制，切换时只改 class 不重绘整体 DOM */
      .menu-item {
        padding: 15px;
        color: #aaa;
        cursor: pointer;
        border-radius: 8px;
        margin-bottom: 10px;
        transition: 0.3s;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .menu-item:hover,
      .menu-item.active {
        background: rgba(0, 242, 234, 0.1);
        color: var(--primary);
        border-left: 3px solid var(--primary);
      }

      /* 用户区：展示当前登录用户名 + 退出入口 */
      .user-panel {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid #333;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        background: var(--primary);
        color: #000;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
      }

      /* 主内容：内部可滚动；每个 panel 通过 active 控制显示 */
      .main-content {
        flex: 1;
        padding: 40px;
        overflow-y: auto;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
        animation: fadeIn 0.5s;
      }

      /* 玻璃卡片：统一容器风格，用于注册/扫描等核心面板 */
      .glass-card {
        background: var(--glass);
        padding: 30px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-width: 800px;
        margin: 0 auto;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      /* 上传区域：点击/拖拽统一交互（Reg 与 Check 共用同一套样式） */
      .upload-area {
        border: 2px dashed #444;
        border-radius: 10px;
        height: 200px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: 0.3s;
        margin: 20px 0;
        background: rgba(255, 255, 255, 0.02);
      }
      .upload-area:hover {
        border-color: var(--primary);
        background: rgba(0, 242, 234, 0.05);
      }

      /* 拖拽高亮：通过 JS addClass/removeClass 控制 */
      .upload-area.drag-over {
        background: rgba(0, 242, 234, 0.15) !important;
        border-color: #00f2ea !important;
        transform: scale(1.02);
        box-shadow: 0 0 30px rgba(0, 242, 234, 0.2);
      }

      /* 侵权监测区域用 secondary 作为高亮色 */
      #dropAreaCheck.drag-over {
        background: rgba(255, 0, 80, 0.15) !important;
        border-color: #ff0050 !important;
      }

      /* 预览图默认隐藏：上传后显示并隐藏占位 icon/text */
      .upload-area img {
        max-height: 100%;
        display: none;
        border-radius: 8px;
      }

      /* 输入框：弱边框 + 半透明背景，保证暗色主题可读性 */
      input[type="text"] {
        width: 100%;
        padding: 15px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid #444;
        color: #fff;
        border-radius: 8px;
        margin-bottom: 20px;
        box-sizing: border-box;
      }

      /* 按钮：主按钮用于确权；危险按钮用于扫描 */
      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn-primary {
        background: var(--primary);
        color: #000;
      }
      .btn-danger {
        background: var(--secondary);
        color: #fff;
      }

      /* 日志面板：用 monospace 呈现“终端风格”状态输出 */
      .log-box {
        background: #000;
        padding: 15px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 12px;
        color: #0f0;
        min-height: 100px;
        margin-top: 20px;
        border-left: 3px solid #333;
      }

      /* 作品画廊：自适应网格；卡片 hover 有轻微上浮 */
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
      .asset-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        overflow: hidden;
        transition: 0.3s;
        position: relative;
      }
      .asset-card:hover {
        transform: translateY(-5px);
        border-color: var(--primary);
      }
      .asset-img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        background: #000;
      }
      .asset-info {
        padding: 15px;
      }
      .asset-title {
        font-weight: bold;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .asset-meta {
        font-size: 12px;
        color: #888;
        margin-bottom: 10px;
      }
      .asset-tx {
        font-size: 10px;
        color: #555;
        word-break: break-all;
        font-family: monospace;
      }

      /* 标签：区分 AI 生成 / 人类创作 */
      .tag {
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: bold;
        position: absolute;
        top: 10px;
        right: 10px;
      }
      .tag-ai {
        background: #ff9f43;
        color: white;
      }
      .tag-human {
        background: var(--primary);
        color: black;
      }

      /* SweetAlert2 置顶，避免被背景/侧栏遮挡 */
      .swal2-container {
        z-index: 99999 !important;
      }
    </style>
  </head>
  <body>
    <!-- 背景特效挂载点（Vanta.NET 会注入 canvas） -->
    <div id="bg-canvas"></div>

    <div class="sidebar">
      <div class="logo"><i class="fas fa-cube"></i> Smart Shadow</div>

      <!-- 侧栏导航：click 只做 tab 切换；我的作品额外触发一次加载 -->
      <div class="menu-item active" onclick="switchTab('tab-welcome', this)">
        <i class="fas fa-home"></i> 系统概览
      </div>
      <div class="menu-item" onclick="switchTab('tab-register', this)">
        <i class="fas fa-fingerprint"></i> 作品确权
      </div>

      <div class="menu-item" onclick="switchTab('tab-check', this)">
        <i class="fas fa-shield-alt"></i> 侵权监测
      </div>

      <div
        class="menu-item"
        onclick="
          loadMyWorks();
          switchTab('tab-myworks', this);
        "
      >
        <i class="fas fa-images"></i> 我的作品
      </div>

      <div class="user-panel">
        <div class="avatar" id="uAvatar">U</div>
        <div>
          <div style="font-weight: bold" id="uName">User</div>
          <div
            style="font-size: 12px; color: #ff4d4f; cursor: pointer"
            onclick="logout()"
          >
            退出登录
          </div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div id="tab-welcome" class="panel active">
        <div class="glass-card">
          <h1>
            👋 欢迎回来，<span id="wName" style="color: var(--primary)"
              >User</span
            >
          </h1>
          <p style="color: #aaa; line-height: 1.6">
            智影链全栈版权保护系统已就绪。
          </p>

          <!-- 状态卡：当前仅展示“在线状态”，数据为静态文案 -->
          <div style="display: flex; gap: 20px; margin-top: 30px">
            <div
              style="
                background: #111;
                padding: 20px;
                border-radius: 10px;
                flex: 1;
                border: 1px solid #333;
              "
            >
              <h3 style="color: #00f2ea">区块链节点</h3>
              <p>🟢 在线 (ChainMaker v2.3)</p>
            </div>
            <div
              style="
                background: #111;
                padding: 20px;
                border-radius: 10px;
                flex: 1;
                border: 1px solid #333;
              "
            >
              <h3 style="color: #ff0050">IPFS 存储</h3>
              <p>🟢 在线 (节点数: 1)</p>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-register" class="panel">
        <div class="glass-card">
          <h2 style="color: var(--primary); margin-top: 0">作品铸造</h2>

          <!-- note：作为作品名称/备注，同时会随表单提交到后端 -->
          <input
            type="text"
            id="noteInput"
            placeholder="请输入作品名称 / 备注"
          />

          <!-- 上传区：点击触发隐藏 input；拖拽由 enableDragDrop 绑定 -->
          <div
            class="upload-area"
            id="dropAreaReg"
            onclick="$('#fileReg').click()"
          >
            <i
              class="fas fa-cloud-upload-alt"
              style="font-size: 40px; color: #555; margin-bottom: 10px"
            ></i>
            <span style="color: #888">点击或拖拽上传图片</span>
            <img id="prevReg" />
          </div>
          <input
            type="file"
            id="fileReg"
            accept="image/*"
            style="display: none"
            onchange="preview(this, 'prevReg')"
          />

          <!-- 调用 /register：上传图片 + AI 分析 + 链上登记 -->
          <button class="btn btn-primary" onclick="doRegister()">
            立即上链
          </button>
          <div class="log-box" id="logReg">> WAITING...</div>
        </div>
      </div>

      <div id="tab-myworks" class="panel">
        <h2 style="margin-top: 0; margin-bottom: 20px">我的数字资产库</h2>

        <!-- 画廊容器：loadMyWorks 拉取历史数据并渲染 asset-card -->
        <div id="gallery-container" class="gallery-grid">
          <div style="color: #aaa">正在从区块链同步数据...</div>
        </div>
      </div>

      <div id="tab-check" class="panel">
        <div class="glass-card" style="border-color: rgba(255, 0, 80, 0.3)">
          <h2 style="color: var(--secondary); margin-top: 0">侵权扫描</h2>

          <!-- 上传疑似图：与确权流程一致，但提交到 /check 做相似度比对 -->
          <div
            class="upload-area"
            id="dropAreaCheck"
            style="border-color: rgba(255, 0, 80, 0.3)"
            onclick="$('#fileCheck').click()"
          >
            <i
              class="fas fa-eye"
              style="font-size: 40px; color: #555; margin-bottom: 10px"
            ></i>
            <span style="color: #888">拖拽或点击上传疑似图</span>
            <img id="prevCheck" />
          </div>
          <input
            type="file"
            id="fileCheck"
            accept="image/*"
            style="display: none"
            onchange="preview(this, 'prevCheck')"
          />

          <button class="btn btn-danger" onclick="doCheck()">开始比对</button>
          <div
            class="log-box"
            id="logCheck"
            style="color: #ff99aa; border-left-color: var(--secondary)"
          >
            > READY...
          </div>
        </div>
      </div>
    </div>

    <script>
      // 登录态：从 localStorage 取用户名，不存在则跳转回首页
      let USER = localStorage.getItem("smart_user");
      if (!USER) window.location.href = "/";

      // UI 初始化：显示用户名与头像首字母
      $("#uName").text(USER);
      $("#wName").text(USER);
      $("#uAvatar").text(USER[0].toUpperCase());

      // 背景特效：Vanta.NET 依赖 three.js（此处颜色与主题色保持一致）
      VANTA.NET({
        el: "#bg-canvas",
        mouseControls: true,
        touchControls: true,
        minHeight: 200.0,
        minWidth: 200.0,
        scale: 1.0,
        scaleMobile: 1.0,
        color: 0x00f2ea,
        backgroundColor: 0x0b0e14,
      });

      // 页面 ready 后绑定拖拽上传（确权区 & 监测区各一套）
      $(document).ready(function () {
        enableDragDrop("dropAreaReg", "fileReg", "prevReg");
        enableDragDrop("dropAreaCheck", "fileCheck", "prevCheck");
      });

      // 退出：清理登录态并回到首页
      function logout() {
        localStorage.removeItem("smart_user");
        window.location.href = "/";
      }

      // Tab 切换：只操作 class，避免重复创建 DOM
      function switchTab(id, el) {
        $(".menu-item").removeClass("active");
        $(el).addClass("active");
        $(".panel").removeClass("active");
        $("#" + id).addClass("active");
      }

      // 图片预览：读取本地文件并显示，同时隐藏上传区占位元素
      function preview(input, imgId) {
        if (input.files && input.files[0]) {
          var r = new FileReader();
          r.onload = function (e) {
            $("#" + imgId)
              .attr("src", e.target.result)
              .show();
            $("#" + imgId)
              .siblings("i,span")
              .hide();
          };
          r.readAsDataURL(input.files[0]);
        }
      }

      // 拖拽上传：drop 后把文件写入 input.files 并复用 preview 渲染
      function enableDragDrop(areaId, inputId, imgId) {
        var $area = $("#" + areaId);
        var $input = $("#" + inputId);
        $area.on("dragenter dragover", function (e) {
          e.preventDefault();
          e.stopPropagation();
          $(this).addClass("drag-over");
        });
        $area.on("dragleave drop", function (e) {
          e.preventDefault();
          e.stopPropagation();
          $(this).removeClass("drag-over");
        });
        $area.on("drop", function (e) {
          var files = e.originalEvent.dataTransfer.files;
          if (files.length > 0) {
            $input[0].files = files;
            preview($input[0], imgId);
          }
        });
      }

      // 确权：上传图片到 /register，由后端完成 AI 分析 + 上链写入
      function doRegister() {
        var file = $("#fileReg")[0].files[0];
        var note = $("#noteInput").val();
        if (!file) return Swal.fire("提示", "请上传图片", "warning");

        // FormData：image/note/username 与后端接口字段保持一致
        var fd = new FormData();
        fd.append("image", file);
        fd.append("note", note);
        fd.append("username", USER);
        $("#logReg").html(`> UPLOADING & AI ANALYSIS...`);

        $.ajax({
          url: "/register",
          type: "POST",
          data: fd,
          processData: false,
          contentType: false,
          success: function (res) {
            // repeat_self：用户已登记过同一作品（幂等提示）
            if (res.status === "repeat_self") {
              Swal.fire("重复登记", "您已拥有该作品", "info");
              $("#logReg").html(
                `> [INFO] ALREADY REGISTERED.\n> TXID: ${res.tx_id}`,
              );
            } else {
              // is_aigc/ai_object：后端的 AI 分类结果
              var aiTag = res.is_aigc ? "[AI GENERATED]" : "[HUMAN ART]";
              Swal.fire("成功", "资产已上链", "success");
              $("#logReg").html(
                `> SUCCESS!\n> TYPE: ${aiTag} ${res.ai_object}\n> TXID: ${res.tx_id.substring(0, 16)}...`,
              );
            }
          },
          error: function (e) {
            $("#logReg").html(`> ERROR: ${e.responseText}`);
          },
        });
      }

      // 监测：上传疑似图到 /check，返回相似度与链上匹配信息
      function doCheck() {
        var file = $("#fileCheck")[0].files[0];
        if (!file) return Swal.fire("提示", "请上传图片", "warning");

        var fd = new FormData();
        fd.append("image", file);
        fd.append("username", USER);
        $("#logCheck").html(`> SCANNING...`);

        $.ajax({
          url: "/check",
          type: "POST",
          data: fd,
          processData: false,
          contentType: false,
          success: function (res) {
            // current_img_info：当前上传图的 AI 属性（可能为空）
            var aiLabel =
              res.current_img_info && res.current_img_info.is_aigc
                ? "🤖 AI 生成"
                : "📷 人类创作";
            var objName = res.current_img_info
              ? res.current_img_info.ai_object
              : "未知";

            $("#logCheck").html(
              `> [SCANNING] 最高相似度: ${res.similarity}%\n> AI 检测主体: ${objName}`,
            );

            // 阈值策略：>=80 高风险；>=55 中风险；否则低风险
            if (res.similarity >= 80) {
              Swal.fire({
                icon: "warning",
                title: "发现高度疑似侵权",
                html: `链上匹配到高度相似资产！<br><br>最高相似度：<b style="color:#ff0050; font-size: 1.2em;">${res.similarity}%</b><br>原作持有者：${res.chain_data ? res.chain_data.owner : "未知"}`,
                background: "#222",
                color: "#fff",
                confirmButtonColor: "#ff0050",
              });
            } else if (res.similarity >= 55) {
              Swal.fire({
                icon: "info",
                title: "存在版权风险",
                text: `检测到 ${res.similarity}% 的相似度，存在部分特征重合，建议人工核对。`,
                background: "#222",
                color: "#fff",
                confirmButtonColor: "#f39c12",
              });
            } else {
              Swal.fire({
                icon: "success",
                title: "未发现版权风险",
                text: `当前库中最高相似度仅为: ${res.similarity}%`,
                background: "#222",
                color: "#fff",
                confirmButtonColor: "#00f2ea",
              });
            }
          },
          error: function (e) {
            $("#logCheck").html(`> ERROR: NETWORK OR AI OFFLINE`);
          },
        });
      }

      // 加载资产列表：GET /api/history?username=... 并渲染到画廊
      function loadMyWorks() {
        $("#gallery-container").html(
          '<div style="color:#aaa;">正在从数据库同步...</div>',
        );
        $.get("/api/history?username=" + USER, function (res) {
          var list = res.data;

          // 空列表：提示用户先去确权/铸造
          if (!list || list.length === 0) {
            $("#gallery-container").html(
              '<div style="color:#666;">暂无作品，快去铸造一个吧！</div>',
            );
            return;
          }

          var html = "";
          list.forEach((item) => {
            // 标签：区分 AI 生成或人类创作
            var tagHtml = item.IsAigc
              ? '<span class="tag tag-ai">AI生成</span>'
              : '<span class="tag tag-human">人类创作</span>';

            // 图片 URL：基于本地 IPFS 网关（按你的部署地址拼接）
            var imgUrl = "http://127.0.0.1:8080/ipfs/" + item.IpfsCid;

            // 轻量转义：避免 note 中单引号破坏 onclick 拼接
            var safeNote = (item.Note || "未命名").replace(/'/g, "\\'");

            // 交易号展示：只显示前 16 位
            var shortTx = item.TxId.substring(0, 16) + "...";

            html += `
                    <div class="asset-card animate__animated animate__fadeInUp">
                        ${tagHtml}
                        <img src="${imgUrl}" class="asset-img" style="cursor:zoom-in; object-fit:cover;" onclick="showFullImage('${imgUrl}', '${safeNote}', '${item.TxId}', '${item.Time}')" onerror="this.src='https://placehold.co/400x300?text=Image+Loading...'">
                        <div class="asset-info">
                            <div class="asset-title" title="${item.Note}">${item.Note || "未命名"}</div>
                            <div class="asset-meta"><i class="far fa-clock"></i> ${item.Time}</div>
                            <div class="asset-tx">TX: ${shortTx}</div>
                        </div>
                    </div>`;
          });
          $("#gallery-container").html(html);
        });
      }

      // 弹窗查看大图：提供“关闭/下载原图”，并锁定页面滚动避免穿透
      window.showFullImage = function (url, title, txid, time) {
        Swal.fire({
          title: `<span style="color:#00f2ea">${title}</span>`,
          html: `
                    <div style="margin-bottom:15px; position:relative;">
                        <div class="img-container" style="border:1px solid #333; border-radius:8px; overflow:hidden; background:#000;">
                            <img src="${url}" style="max-width:100%; max-height:60vh; display:block; margin:0 auto;">
                        </div>
                        <div style="text-align:left; margin-top:15px; font-size:13px; color:#aaa; background:rgba(255,255,255,0.05); padding:15px; border-radius:8px;">
                            <div style="margin-bottom:5px;"><i class="fas fa-clock" style="width:20px;"></i> <span style="color:#fff">确权时间:</span> ${time}</div>
                            <div style="margin-bottom:5px;"><i class="fas fa-link" style="width:20px;"></i> <span style="color:#fff">交易哈希:</span> <span style="font-family:monospace; color:#ff0050">${txid.substring(0, 20)}...</span></div>
                            <div><i class="fas fa-shield-alt" style="width:20px;"></i> <span style="color:#fff">资产状态:</span> <span style="color:#2ecc71; border:1px solid #2ecc71; padding:0 4px; border-radius:3px; font-size:10px;">ON-CHAIN</span></div>
                        </div>
                    </div>
                `,
          width: "600px",
          background: "#0b0e14",
          showConfirmButton: false,
          showCloseButton: true,
          showCancelButton: true,
          cancelButtonText: '<i class="fas fa-download"></i> 下载原图',
          cancelButtonColor: "#333",
          didOpen: () => {
            document.body.style.overflow = "hidden";
            // 下载：新窗口打开原图 URL（由浏览器处理保存）
            Swal.getCancelButton().onclick = () => window.open(url, "_blank");
          },
          willClose: () => {
            document.body.style.overflow = "auto";
          },
        });
      };
    </script>
  </body>
</html>
